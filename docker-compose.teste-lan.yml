services:
  base: &base
    image: chatwootnext:teste
    pull_policy: never
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '192.168.1.32:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - redis_data:/data

volumes:
  storage_data:
    name: chatwootnext-release-consolidada-producao-20261029_storage_data
  postgres_data:
    name: chatwootnext-release-consolidada-producao-20261029_postgres_data
  redis_data:
    name: chatwootnext-release-consolidada-producao-20261029_redis_data
