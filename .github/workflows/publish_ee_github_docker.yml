name: Publish Chatwoot EE isolated build (src 15fa2b33)

# ISOLATED one-shot EE image build from pinned source commit
# 15fa2b33d6618d4dfcbd9357d36f6da62ecb3944.
# Manual dispatch ONLY, ONLY from branch ci/ee-build-15fa2b33. This branch is
# never merged to main. Publishes ONLY the tag
# ee-src-15fa2b33d6618d4dfcbd9357d36f6da62ecb3944. latest-ee and every
# fix-*-ee tag are never written by this workflow (the merge step names a
# single -t, and a pre/post check fails the run if a protected tag drifts).
# GHCR tags are mutable: the deployment identity is the final manifest digest
# recorded in the Action summary, not the tag string.
# Source SHA (application code) vs workflow SHA (this branch commit) are
# recorded separately in the summary; do not confuse them.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

concurrency:
  group: ee-build-15fa2b33
  cancel-in-progress: false

env:
  GITHUB_REPO: ghcr.io/${{ github.repository }}
  SOURCE_SHA: 15fa2b33d6618d4dfcbd9357d36f6da62ecb3944
  EE_TAG: ee-src-15fa2b33d6618d4dfcbd9357d36f6da62ecb3944
  EXPECTED_BRANCH: ci/ee-build-15fa2b33

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only manual dispatch on the dedicated branch
        run: |
          if [ "${{ github.ref_name }}" != "${{ env.EXPECTED_BRANCH }}" ]; then
            echo "Refusing: this workflow runs only on '${{ env.EXPECTED_BRANCH }}' (got '${{ github.ref_name }}')." >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Refusing: manual dispatch only (got '${{ github.event_name }}')." >&2
            exit 1
          fi
          echo "Guard OK: dispatch on '${{ github.ref_name }}'."

  preflight:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refuse if the isolated tag already exists (fail closed)
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          set +e
          OUT="$(docker buildx imagetools inspect "$REPO:${{ env.EE_TAG }}" 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "Refusing: $REPO:${{ env.EE_TAG }} already exists. Tags are mutable, so an existing tag must never be overwritten." >&2
            exit 1
          fi
          # A missing tag is only trustworthy when the error actually says so;
          # auth/network failures must never be mistaken for "tag absent".
          if printf '%s' "$OUT" | grep -qiE 'manifest unknown|MANIFEST_UNKNOWN|not found|not exist|no such'; then
            echo "Isolated tag absent — safe to proceed."
          else
            printf '%s\n' "$OUT" >&2
            echo "Refusing: could not prove the isolated tag is absent (registry/auth/network?)." >&2
            exit 1
          fi

      - name: Record protected-tag baseline (latest-ee, fix-producao-20261106-ee)
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository }}"
          : > protected.txt
          for T in latest-ee fix-producao-20261106-ee; do
            if ! OUT="$(docker buildx imagetools inspect "$REPO:$T" 2>&1)"; then
              printf '%s\n' "$OUT" >&2
              echo "Refusing: could not inspect protected tag $T (registry/auth/network/not-found?). Failing closed." >&2
              exit 1
            fi
            DIGEST="$(printf '%s\n' "$OUT" | grep -i '^Digest:' | grep -oE 'sha256:[0-9a-f]{64}' | head -n 1 || true)"
            COUNT="$(printf '%s\n' "$OUT" | grep -ci '^Digest:' || true)"
            if [ "$COUNT" != "1" ] || [ -z "$DIGEST" ]; then
              echo "Refusing: could not extract a single canonical manifest digest for $T (ambiguous output?). Failing closed." >&2
              printf '%s\n' "$OUT" >&2
              exit 1
            fi
            echo "$T $DIGEST" >> protected.txt
          done
          # Strict baseline shape: exactly the two expected protected tags,
          # once each, each with a full canonical digest; nothing else.
          # Never hash human-readable inspect output: only the Digest: value.
          if [ "$(wc -l < protected.txt | tr -d ' ')" != "2" ]; then
            echo "Refusing: baseline must hold exactly 2 entries. Failing closed." >&2
            cat protected.txt >&2
            exit 1
          fi
          for T in latest-ee fix-producao-20261106-ee; do
            if [ "$(grep -cE "^${T} sha256:[0-9a-f]{64}$" protected.txt || true)" != "1" ]; then
              echo "Refusing: baseline entry for $T missing, duplicated or malformed. Failing closed." >&2
              cat protected.txt >&2
              exit 1
            fi
          done
          if grep -qvE '^(latest-ee|fix-producao-20261106-ee) sha256:[0-9a-f]{64}$' protected.txt; then
            echo "Refusing: baseline holds an unexpected entry. Failing closed." >&2
            cat protected.txt >&2
            exit 1
          fi
          cat protected.txt

      - name: Upload protected-tag baseline
        uses: actions/upload-artifact@v4
        with:
          name: protected-tags
          path: protected.txt
          retention-days: 1

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout pinned EE source (full SHA, not the workflow branch)
        uses: actions/checkout@v4
        with:
          ref: 15fa2b33d6618d4dfcbd9357d36f6da62ecb3944

      - name: Verify pinned source SHA and enterprise overlay
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "${{ env.SOURCE_SHA }}" ]; then
            echo "Refusing: checked out $HEAD_SHA, expected ${{ env.SOURCE_SHA }}." >&2
            exit 1
          fi
          if [ ! -d enterprise ]; then
            echo "Refusing: enterprise/ overlay missing from the pinned source." >&2
            exit 1
          fi
          echo "Source OK: $HEAD_SHA with enterprise/ overlay."

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Update version in app.yml
        env:
          GIT_REF: ${{ env.EE_TAG }}
        run: |
          if [[ "$GIT_REF" =~ ^v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Updating version to: $VERSION"
            sed -i "s/version: '.*'/version: '$VERSION'/" config/app.yml
          else
            echo "No version tag found, keeping existing version"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest only (no tags yet)
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # NOTE: provenance/attestations stay at the builder default (enabled).
          # Never set provenance to false to "simplify" verification.
          outputs: type=image,name=${{ env.GITHUB_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify EE image content by digest (before any tag exists)
        run: |
          REF="${{ env.GITHUB_REPO }}@${{ steps.build-ghcr.outputs.digest }}"
          docker pull "$REF"
          CW="$(docker run --rm --entrypoint sh "$REF" -c 'printenv CW_EDITION')"
          if [ "$CW" != "ee" ]; then
            echo "Refusing: CW_EDITION='$CW', expected 'ee'." >&2
            exit 1
          fi
          docker run --rm --entrypoint sh "$REF" -c 'test -d /app/enterprise' \
            || { echo "Refusing: /app/enterprise missing from image." >&2; exit 1; }
          SHA="$(docker run --rm --entrypoint sh "$REF" -c 'cat /app/.git_sha' | tr -d '[:space:]')"
          if [ "$SHA" != "${{ env.SOURCE_SHA }}" ]; then
            echo "Refusing: image /app/.git_sha='$SHA', expected '${{ env.SOURCE_SHA }}'." >&2
            exit 1
          fi
          echo "Image content OK: CW_EDITION=ee, /app/enterprise present, source ${{ env.SOURCE_SHA }}."

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Record platform result in summary
        run: |
          {
            echo "### build ${{ matrix.platform }} (native runner)"
            echo "- source SHA (app code): ${{ env.SOURCE_SHA }}"
            echo "- workflow SHA (branch commit): ${{ github.sha }}"
            echo "- platform digest: ${{ steps.build-ghcr.outputs.digest }}"
            echo "- verified in-image by digest: CW_EDITION=ee, /app/enterprise present, /app/.git_sha == source SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
      - preflight
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download protected-tag baseline
        uses: actions/download-artifact@v4
        with:
          name: protected-tags
          path: ${{ runner.temp }}/protected

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Abort if a protected tag drifted before publication
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository }}"
          BASE="${{ runner.temp }}/protected/protected.txt"
          # Fail closed on malformed/missing/duplicated baseline entries.
          if [ "$(wc -l < "$BASE" | tr -d ' ')" != "2" ]; then
            echo "Refusing: baseline must hold exactly 2 entries. Failing closed." >&2
            cat "$BASE" >&2
            exit 1
          fi
          for T in latest-ee fix-producao-20261106-ee; do
            if [ "$(grep -cE "^${T} sha256:[0-9a-f]{64}$" "$BASE" || true)" != "1" ]; then
              echo "Refusing: baseline entry for $T missing, duplicated or malformed. Failing closed." >&2
              cat "$BASE" >&2
              exit 1
            fi
          done
          if grep -qvE '^(latest-ee|fix-producao-20261106-ee) sha256:[0-9a-f]{64}$' "$BASE"; then
            echo "Refusing: baseline holds an unexpected entry. Failing closed." >&2
            cat "$BASE" >&2
            exit 1
          fi
          while IFS=' ' read -r TAG OLD; do
            if ! OUT="$(docker buildx imagetools inspect "$REPO:$TAG" 2>&1)"; then
              printf '%s\n' "$OUT" >&2
              echo "Refusing: could not re-inspect protected tag $TAG (registry/auth/network/not-found?). Failing closed." >&2
              exit 1
            fi
            NEW="$(printf '%s\n' "$OUT" | grep -i '^Digest:' | grep -oE 'sha256:[0-9a-f]{64}' | head -n 1 || true)"
            COUNT="$(printf '%s\n' "$OUT" | grep -ci '^Digest:' || true)"
            if [ "$COUNT" != "1" ] || [ -z "$NEW" ]; then
              echo "Refusing: could not extract a single canonical manifest digest for $TAG. Failing closed." >&2
              printf '%s\n' "$OUT" >&2
              exit 1
            fi
            if [ "$NEW" != "$OLD" ]; then
              echo "Refusing: protected tag $TAG changed since preflight ($OLD -> $NEW)." >&2
              exit 1
            fi
          done < "$BASE"
          echo "Protected tags unchanged since preflight (canonical digests match)."

      - name: Create the single isolated tag from both digests
        id: create
        working-directory: ${{ runner.temp }}/digests
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          # The ONLY tag this workflow ever creates. latest-ee and fix-*-ee
          # are deliberately absent from this command.
          docker buildx imagetools create \
            -t "$REPO:${{ env.EE_TAG }}" \
            $(printf "$REPO@sha256:%s " *)
          INSPECT="$(docker buildx imagetools inspect "$REPO:${{ env.EE_TAG }}")"
          printf '%s\n' "$INSPECT"
          INDEX_DIGEST="$(printf '%s' "$INSPECT" | grep -i '^Digest:' | grep -oE 'sha256:[0-9a-f]{64}' | head -1)"
          if [ -z "$INDEX_DIGEST" ]; then
            echo "Refusing: could not determine the final index digest." >&2
            exit 1
          fi
          echo "index-digest=$INDEX_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Confirm protected tags still untouched after publication
        run: |
          set -euo pipefail
          REPO="ghcr.io/${{ github.repository }}"
          BASE="${{ runner.temp }}/protected/protected.txt"
          # Fail closed on malformed/missing/duplicated baseline entries.
          if [ "$(wc -l < "$BASE" | tr -d ' ')" != "2" ]; then
            echo "ALERT: baseline must hold exactly 2 entries. Failing closed." >&2
            cat "$BASE" >&2
            exit 1
          fi
          for T in latest-ee fix-producao-20261106-ee; do
            if [ "$(grep -cE "^${T} sha256:[0-9a-f]{64}$" "$BASE" || true)" != "1" ]; then
              echo "ALERT: baseline entry for $T missing, duplicated or malformed. Failing closed." >&2
              cat "$BASE" >&2
              exit 1
            fi
          done
          if grep -qvE '^(latest-ee|fix-producao-20261106-ee) sha256:[0-9a-f]{64}$' "$BASE"; then
            echo "ALERT: baseline holds an unexpected entry. Failing closed." >&2
            cat "$BASE" >&2
            exit 1
          fi
          while IFS=' ' read -r TAG OLD; do
            if ! OUT="$(docker buildx imagetools inspect "$REPO:$TAG" 2>&1)"; then
              printf '%s\n' "$OUT" >&2
              echo "ALERT: could not re-inspect protected tag $TAG after publication. Failing closed." >&2
              exit 1
            fi
            NEW="$(printf '%s\n' "$OUT" | grep -i '^Digest:' | grep -oE 'sha256:[0-9a-f]{64}' | head -n 1 || true)"
            COUNT="$(printf '%s\n' "$OUT" | grep -ci '^Digest:' || true)"
            if [ "$COUNT" != "1" ] || [ -z "$NEW" ]; then
              echo "ALERT: could not extract a single canonical manifest digest for $TAG. Failing closed." >&2
              printf '%s\n' "$OUT" >&2
              exit 1
            fi
            if [ "$NEW" != "$OLD" ]; then
              echo "ALERT: protected tag $TAG changed during publication ($OLD -> $NEW)." >&2
              exit 1
            fi
          done < "$BASE"
          echo "Protected tags untouched by publication (canonical digests match)."

      - name: Record deployment identity in summary
        run: |
          {
            echo "## EE isolated build prepared"
            echo "- source SHA (app code): ${{ env.SOURCE_SHA }}"
            echo "- workflow SHA (branch ${{ env.EXPECTED_BRANCH }} commit): ${{ github.sha }}"
            echo "- image reference: ghcr.io/${{ github.repository }}:${{ env.EE_TAG }}"
            echo "- final index digest: ${{ steps.create.outputs.index-digest }}"
            echo "- deployment identity (digest, tags are mutable): ghcr.io/${{ github.repository }}@${{ steps.create.outputs.index-digest }}"
            echo "- platform digests merged: $(ls ${{ runner.temp }}/digests | sort | tr '\n' ' ')"
            echo "- protected tags verified unchanged: latest-ee, fix-producao-20261106-ee"
            echo "- provenance: builder default (enabled, not disabled)"
          } >> "$GITHUB_STEP_SUMMARY"
