# Deploy com imagem pronta do fazer.ai (sem build local)
# Uso:
#   # use o .env de produção desta VM e valide SECRET_KEY_BASE, senhas, FRONTEND_URL
#   docker compose -f docker-compose.fazer.yml up -d
#   docker compose -f docker-compose.fazer.yml exec rails bundle exec rails runner /scripts/liberar_premium.rb
#
# Liberação: o script é montado de ./script no container.

services:
  base: &base
    image: ghcr.io/fazer-ai/chatwoot:latest
    pull_policy: always
    env_file: .env
    volumes:
      - storage_data:/app/storage
      - ./script:/scripts:ro
      - ./enterprise:/app/enterprise:ro

  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '192.168.1.39:${CHATWOOT_PORT:-23003}:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    healthcheck:
      test: ['CMD-SHELL', "ruby -r net/http -e 'r = Net::HTTP.get_response(URI(\"http://127.0.0.1:3000/\")); exit(r.code.to_i < 400 ? 0 : 1)'"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s

  sidekiq:
    <<: *base
    depends_on:
      rails:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  premium_watch:
    <<: *base
    depends_on:
      rails:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'rails', 'runner', '/scripts/watch_liberar_premium.rb']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: always
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
