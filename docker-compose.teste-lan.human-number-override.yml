# Override TESTE human-number Saude por unidades (nao secreto; valores via ambiente em memoria).
# Uso: BAILEYS_PROVIDER_DEFAULT_API_KEY + CONNECTA_* exportados em memoria (nunca literal),
# docker compose -f docker-compose.teste-lan.yml -f docker-compose.teste-lan.baileys-override.yml -f docker-compose.teste-lan.human-number-override.yml up -d --no-deps rails sidekiq
# Preserva override Baileys (URL/key default) e pula migrations (entrypoint do override Baileys).
# AVISO: recriar Rails/Sidekiq somente com os 2 composes antigos remove as flags human-number/HMAC/recepcao;
# usar sempre os 3 composes acima enquanto o modo Saude por unidades estiver ativo.
services:
  rails:
    environment:
      # somente teste LAN; produção usará allowlist restrita
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
      - CONNECTA_HUMAN_NUMBER_ENABLED=true
      - CONNECTA_ACCOUNT_ID=1
      # usuário de serviço "Conecta Cidade Bot" (id 5, conta 2): único liberado a enviar em conversas em recepção
      - CONNECTA_RECEPTION_SENDER_USER_IDS=2
      - CONNECTA_PLATFORM_URL=http://192.168.1.32:9090
      - CONNECTA_RECEPTION_ORG_UNIT_ID=f288141d-7514-4ffe-8ffe-9f163f5e3bde
      - CONNECTA_PLATFORM_TO_FORK_SECRET=${CONNECTA_PLATFORM_TO_FORK_SECRET:?defina em memoria a partir do secrets privado}
      - CONNECTA_FORK_TO_PLATFORM_SECRET=${CONNECTA_FORK_TO_PLATFORM_SECRET:?defina em memoria a partir do secrets privado}
  sidekiq:
    environment:
      # somente teste LAN; produção usará allowlist restrita
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
      - CONNECTA_HUMAN_NUMBER_ENABLED=true
      - CONNECTA_ACCOUNT_ID=1
      # usuário de serviço "Conecta Cidade Bot" (id 5, conta 2): único liberado a enviar em conversas em recepção
      - CONNECTA_RECEPTION_SENDER_USER_IDS=2
      - CONNECTA_PLATFORM_URL=http://192.168.1.32:9090
      - CONNECTA_RECEPTION_ORG_UNIT_ID=f288141d-7514-4ffe-8ffe-9f163f5e3bde
      - CONNECTA_PLATFORM_TO_FORK_SECRET=${CONNECTA_PLATFORM_TO_FORK_SECRET:?defina em memoria a partir do secrets privado}
      - CONNECTA_FORK_TO_PLATFORM_SECRET=${CONNECTA_FORK_TO_PLATFORM_SECRET:?defina em memoria a partir do secrets privado}
